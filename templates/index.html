<!DOCTYPE html>
<html>
<head>
    <title>Code Mentor</title>

    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0a0f2c, #1a1f4a);
            color: white;
            display: flex;
            height: 100vh;
        }

        /* SIDEBAR */
        .sidebar {
            width: 220px;
            background: #070d2b;
            padding: 20px;
        }

        .logo {
            margin-bottom: 30px;
            color: #c7a6ff;
        }

        .menu-item {
            margin: 15px 0;
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
        }

        .menu-item:hover {
            background: rgba(255,255,255,0.08);
        }

        .active {
            background: rgba(255,255,255,0.1);
        }

        /* MAIN */
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 25px;
        }

        /* HEADER BOX */
        .top-box {
            width: 100%;
            height: 60px;
            border-radius: 40px;
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(15px);
            margin-top: 15px;
        }

        /* CHAT CONTAINER */
        #chat-container {
            height: 100px;
            overflow-y: auto;
            margin-top: 15px;
            padding: 10px;
            border-radius: 15px;
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(20px);
        }

        /* MESSAGES */
        .message {
            margin: 10px 0;
            padding: 12px 15px;
            border-radius: 20px;
            max-width: 60%;
            word-wrap: break-word;
        }

        .user {
            margin-left: auto;
            background: linear-gradient(135deg, #6c63ff, #9a5cff);
        }

        .bot {
            margin-right: auto;
            background: rgba(255,255,255,0.08);
        }

        /* INPUT */
        .input-area {
            display: flex;
            margin-top: 10px;
            align-items: center;
        }

        input {
            flex: 1;
            padding: 14px 18px;
            border-radius: 30px;
            border: none;
            outline: none;
            background: rgba(255,255,255,0.08);
            color: white;
        }

        button {
            margin-left: 10px;
            padding: 12px 20px;
            border-radius: 30px;
            border: none;
            background: linear-gradient(135deg, #6c63ff, #9a5cff);
            color: white;
            cursor: pointer;
        }

        /* HISTORY */
        #history-section {
            display: none;
        }

        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .history-item {
            padding: 10px;
            margin: 8px 0;
            background: rgba(255,255,255,0.08);
            border-radius: 8px;
            cursor: pointer;
        }

        .clear-btn {
            padding: 8px 14px;
            background: #ff4d4d;
            border: none;
            border-radius: 8px;
            color: white;
            cursor: pointer;
        }

        /* TUTORIALS */
        .tutorial-item {
            padding: 12px;
            margin: 10px 0;
            background: rgba(255,255,255,0.08);
            border-radius: 10px;
            cursor: pointer;
        }

    </style>
</head>

<body>

<div class="sidebar">
    <div class="logo"><h2>⚡ Code Mentor</h2></div>

    <div class="menu-item active" onclick="showSection('chat')">Dashboard</div>
    <div class="menu-item" onclick="showSection('history')">History</div>
    <div class="menu-item" onclick="showSection('tutorials')">Tutorials</div>
</div>

<div class="main">

    <!-- CHAT -->
    <div id="chat-section">
        <center><h2>Ask Your DSA Instructor</h2></center>

        

        <!-- ✅ FIXED: separate chat -->
        <div id="chat-container"></div>

        <div class="input-area">
            <input type="text" id="query" placeholder="Ask something...">
            <button onclick="askQuestion()">Send</button>
        </div>
    </div>

    <!-- HISTORY -->
    <div id="history-section">
        <div class="history-header">
            <h1>History</h1>
            <button class="clear-btn" onclick="clearHistory()">Clear</button>
        </div>
        <div id="history-list"></div>
    </div>

    <!-- TUTORIALS -->
    <div id="tutorials-section" style="display:none;">
        <h1>Tutorials</h1>

        <div class="tutorial-item" onclick="loadTopic('Array')">Array</div>
        <div class="tutorial-item" onclick="loadTopic('Stack')">Stack</div>
        <div class="tutorial-item" onclick="loadTopic('String')">String</div>
        <div class="tutorial-item" onclick="loadTopic('Queue')">Queue</div>
        <div class="tutorial-item" onclick="loadTopic('Graph')">Graph</div>

        <div id="tutorial-content"></div>
    </div>

</div>

<script>

// ADD MESSAGE
function addMessage(text, type) {
    let chat = document.getElementById("chat-container");

    let msg = document.createElement("div");
    msg.className = "message " + type;
    msg.innerText = text;

    chat.appendChild(msg);
    chat.scrollTop = chat.scrollHeight;
}

// ASK
function askQuestion() {
    let input = document.getElementById("query");
    let query = input.value.trim();

    if (!query) return;

    addMessage(query, "user");
    saveToHistory(query);

    input.value = "";
    addMessage("Typing...", "bot");

    fetch("/ask", {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: "query=" + encodeURIComponent(query)
    })
    .then(res => res.text())
    .then(data => {
        let chat = document.getElementById("chat-container");
        chat.removeChild(chat.lastChild);
        addMessage(data, "bot");
    });
}

// NAVIGATION
function showSection(section) {
    document.getElementById("chat-section").style.display = "none";
    document.getElementById("history-section").style.display = "none";
    document.getElementById("tutorials-section").style.display = "none";

    if (section === "chat") {
        document.getElementById("chat-section").style.display = "block";
    } else if (section === "history") {
        document.getElementById("history-section").style.display = "block";
        loadHistory();
    } else {
        document.getElementById("tutorials-section").style.display = "block";
    }
}

// HISTORY
function saveToHistory(query) {
    let h = JSON.parse(localStorage.getItem("chat_history")) || [];
    h.push(query);
    localStorage.setItem("chat_history", JSON.stringify(h));
}

function loadHistory() {
    let h = JSON.parse(localStorage.getItem("chat_history")) || [];
    let container = document.getElementById("history-list");
    container.innerHTML = "";

    h.reverse().forEach(q => {
        let div = document.createElement("div");
        div.className = "history-item";
        div.innerText = q;
        div.onclick = () => {
            showSection("chat");
            document.getElementById("query").value = q;
        };
        container.appendChild(div);
    });
}

function clearHistory() {
    localStorage.removeItem("chat_history");
    loadHistory();
}

// TUTORIAL
function loadTopic(topic) {
    document.getElementById("tutorial-content").innerHTML =
        `<h3>${topic}</h3>
         <button onclick="askFromTutorial('${topic}')">Ask AI</button>`;
}

function askFromTutorial(topic) {
    showSection("chat");
    document.getElementById("query").value = "Explain " + topic;
}

</script>

</body>
</html>
